<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="landing.css">
    <link rel="icon" type="image/png" href="images/linkedly_favicon.png" sizes="16x16">
    <title>Linkedly</title>
</head>
<body>
    <div class="nav">
        <div class="navbar-container">
            <div class="navbar-brand">
                <h2>Linkedly</h2>
                <img src="images\chain-logo-small-svg.svg" alt="logo">
            </div>
            <a href="https://chrome.google.com/webstore/detail/linkedly/imogamaabehbgfjmddalkhmimcnmfmid" target="_blank" id="getAppBtn">Get the App!</a>
        </div>
    </div>
    <div class="scroll-snap-container">
        <div class="bigTextcontainer">
            <div class="hero-text-container">
                <h1>AI networking to help you</h1>
                <div class="aTcontainer">
                    <h1 id="animatedText"></h1><h1 id="typeCursor">|</h1>
                </div>
            </div>
        </div>
        <div class="hero">
            <div class="demo-text">
                <h1>watch our >3 min demo video</h1>
                <div class="arrow">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <div class="demo">
                <iframe width="640" height="400" src="https://www.loom.com/embed/d3f72c66a2004a1b98c23c7b11dcb089?sid=5a83035b-7cab-4e87-83ea-734f71f4710d" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
            </div>
        </div>
        <div class="text-section">
            <h1>With a little bit of information...</h1>
            <div class="video-container">
                <video autoplay loop muted>
                    <source src="images/createuservid.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                    </video> 
            </div>
        </div>
        <div class="text-section">
            <div class="video-container">
                <video autoplay loop muted>
                    <source src="images/messageGen.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                    </video> 
            </div>
            <div class="info-container">
                <h1>...Linkedly generates</h1>
                <ul>
                    <li><h1>a Tailored Chat GPT reach-out message</h1></li>
                    <li><h1>a List of Email Addresses found with Hunter.io</h1></li>
                </ul>

            </div>
        </div>
        <div class="text-section">
            <div class="info-container">
                <h1>Build downloadable lists of connections.</h1>
            </div>
            <div class="video-container">
                <video autoplay loop muted>
                    <source src="images/buildLists.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video> 
            </div>
        </div>
        <div class="footer">
            <div class="footer-container">
                <div class="top-row">
                    <div class="logo">
                        <h1>Linkedly</h1>
                        <img src="images/chain-logo-small-svg.svg" alt="linkedlylogo">
                    </div>
                    <div id="getChromeBtn">
                        <a href="https://chrome.google.com/webstore/detail/linkedly/imogamaabehbgfjmddalkhmimcnmfmid" target="_blank"><img src="images/getChrome.png" alt="getChromeBtn"></a>
                    </div>
                </div>
                <div class="social-container">
                    <div class="socials">
                        <img src="images/instagramicon.svg" id="insta-icon" alt="instagramicon">
                        <img src="images/twittericon.svg" id="twitter-icon" alt="twittericon">
                        <img src="images/linkedinicon.svg" id="linkedin-icon" alt="linkedinicon">                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="landing.js"></script>
</body>
</html>
